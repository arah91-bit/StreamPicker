<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Set up your taste</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117; --card:#161b22; --line:#262d38; --ink:#e6edf3; --dim:#8b949e;
  --yes:#3fb950; --no:#d4675e; --maybe:#6e7681; --accent:#e0a33e;
  --save:#58a6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;
  padding:max(16px,env(safe-area-inset-top)) 16px
          max(16px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
/* The deck step is the flex context the card grows inside. Without this it was
   a plain block, `.deck{flex:1}` below had nothing to take a share of, and the
   card was pinned at its min-height with the slack collecting under the wheel
   instead of going to the poster. `min-height:0` so a tall card can shrink
   rather than push the wheel off a short screen. */
#step-deck{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.who{color:var(--dim);font-size:.9rem}
.hint{color:var(--dim);font-size:.92rem;margin:0}
.hide{display:none!important}

/* step 1 — pick what you like */
.grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:9px 14px;font-size:.92rem;cursor:pointer;
  font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:#1b1300;font-weight:600}
.lbl{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin:12px 0 0}
.go{margin-top:auto;position:sticky;bottom:0;padding-top:12px;
  background:linear-gradient(transparent,var(--bg) 34%)}
button.primary{width:100%;padding:15px;border-radius:12px;border:0;
  background:var(--accent);color:#1b1300;font-size:1rem;font-weight:700;
  font-family:inherit;cursor:pointer}
button.primary:disabled{background:#30363d;color:var(--dim)}

/* step 2 — the deck */
/* The floor is load-bearing. `flex:1` only hands out space that is left over,
   and on a phone the header, buttons and labels already fill the viewport —
   so with `min-height:0` this collapsed to nothing and the card, being
   absolutely positioned inside it, rendered 0x0. The page looked empty while
   the API was returning a full deck. */
.deck{position:relative;flex:1;min-height:clamp(220px,46vh,480px)}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
/* `contain`, not `cover`: a poster is the thing being judged, and cropping
   the top and bottom off it cuts the title and the faces — the two things
   somebody needs in order to know whether they have seen it. Letterboxing on
   a narrow screen is the lesser cost. */
.card img{flex:1;min-height:0;width:100%;object-fit:contain;background:#0b0e13}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px}
.t{font-weight:700;line-height:1.25}
.sub{color:var(--dim);font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap}
/* The answer wheel.

   Five stacked buttons was a column of small rectangles that pushed the poster
   off a phone screen, and every one of them needed aiming at. A wheel is one
   shape the thumb can learn: four quarters at up/down/left/right plus a hub,
   each a big target in a fixed direction, so answering fast stops being a
   matter of reading labels.

   Geometry: each wedge is a full-size button clipped to a triangle from the
   centre to two corners; the container's border-radius plus overflow:hidden
   turns each triangle into a quarter-circle sector. clip-path takes hit
   testing with it, so the visible shape is exactly the tappable one. */
/* `clip-path` as well as `border-radius`, and it is not belt and braces:
   overflow:hidden clips what gets *painted* but not what gets *hit*, so the
   four corners outside the circle stayed tappable while looking like page
   background. A tap there registered an answer nobody meant to give.
   clip-path clips both. */
.wheel{position:relative;flex:none;align-self:center;
  width:min(74vw,32vh,270px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  clip-path:circle(50%);background:var(--card);border:1px solid var(--line)}
.wedge{position:absolute;inset:0;border:0;font-family:inherit;font-size:.72rem;
  font-weight:650;line-height:1.15;cursor:pointer;display:flex;padding:8px;
  text-align:center}
/* The two side labels sit on the horizontal midline, which is exactly where
   the hub is, so their width is not a matter of taste: anything wider than the
   gap between the rim and the hub gets covered by it. Measured in percentages
   of the wheel so it holds at every size — at the smallest, "Not for me" was
   rendering as "Not for m". */
.wedge span{display:flex;flex-direction:column;align-items:center;gap:3px;
  max-width:56%}
.w-left span,.w-right span{max-width:32%}
.wedge .em{font-size:1.3rem;line-height:1}
.w-up{clip-path:polygon(50% 50%,0 0,100% 0);
  align-items:flex-start;justify-content:center;
  background:#12233a;color:var(--save)}
.w-right{clip-path:polygon(50% 50%,100% 0,100% 100%);
  align-items:center;justify-content:flex-end;
  background:#132b1a;color:var(--yes)}
.w-down{clip-path:polygon(50% 50%,100% 100%,0 100%);
  align-items:flex-end;justify-content:center;
  background:#1b2029;color:var(--dim)}
.w-left{clip-path:polygon(50% 50%,0 100%,0 0);
  align-items:center;justify-content:flex-start;
  background:#2e1917;color:var(--no)}
/* Two bars on the diagonals. A bar as long as the container, rotated 45° about
   its own centre, spans the circle exactly — the circle's diameter is the
   container's side. */
.spoke{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;
  background:var(--bg);pointer-events:none;z-index:1}
.spoke.a{transform:rotate(45deg)}
.spoke.b{transform:rotate(-45deg)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:31%;aspect-ratio:1;border-radius:50%;z-index:2;
  border:2px solid var(--line);background:var(--card);color:var(--dim);
  font-family:inherit;font-size:.72rem;font-weight:650;line-height:1.1;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:4px}
.hub .em{font-size:1.15rem;line-height:1}
.wedge:active,.hub:active{filter:brightness(1.45)}
/* There is deliberately no progress bar, tally or standing instruction here.
   The card and the wheel are the whole screen: the poster is what somebody is
   judging and the wheel is how they answer, and everything else was furniture
   competing with them for a phone-sized viewport. Counting up to a target also
   framed the session as a chore with a finish line, which is the opposite of
   how it wants to be used — the answers are worth having whether somebody
   gives twelve or two hundred. Nothing is lost by not saying so: each tap is
   saved on its own and the next card arriving is the acknowledgement. */
/* The card leaves in the direction of the button that answered it, so the
   gesture and the wheel teach each other. */
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .18s ease,opacity .18s ease}
  .card.out-left{transform:translateX(-32px) rotate(-4deg);opacity:0}
  .card.out-right{transform:translateX(32px) rotate(4deg);opacity:0}
  .card.out-up{transform:translateY(-28px);opacity:0}
  .card.out-down{transform:translateY(24px);opacity:0}
  .card.out-fade{transform:scale(.96);opacity:0}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head>
<body><div class="wrap">

<section id="step-picks">
  <!-- The title and the name live here rather than above both steps. On the
       deck they were furniture stealing height from the poster; here they are
       load-bearing, because this is the screen every visit lands on and a
       household has one of these links per person. Somebody opening the wrong
       one would train the wrong profile, and nothing else on the page says
       whose it is. -->
  <header>
    <h1>Set up your taste</h1>
    <p class="who">for <b>__VIEWER__</b></p>
  </header>
  <p class="hint">Pick a few things you enjoy. This just decides what you get
    asked about next — you can change it later by opening this link again.</p>
  <p class="lbl">Genres</p>
  <div class="grid" id="genres"></div>
  <p class="lbl">Anywhere in particular?</p>
  <div class="grid" id="countries"></div>
  <div class="go"><button class="primary" id="start" disabled>Pick at least one</button></div>
</section>

<section id="step-deck" class="hide">
  <div class="deck" id="deck"></div>
  <div class="wheel">
    <button class="wedge w-up" data-v="watchlist" type="button"
      aria-label="Add to my Want to Watch list">
      <span><span class="em">🔖</span>Want to watch</span></button>
    <button class="wedge w-right" data-v="liked" type="button"
      aria-label="I liked it">
      <span><span class="em">👍</span>Liked it</span></button>
    <button class="wedge w-down" data-v="unknown" type="button"
      aria-label="I have never seen it">
      <span><span class="em">🤷</span>Never seen it</span></button>
    <button class="wedge w-left" data-v="disliked" type="button"
      aria-label="Not for me">
      <span><span class="em">👎</span>Not for me</span></button>
    <i class="spoke a"></i><i class="spoke b"></i>
    <button class="hub" data-v="seen" type="button"
      aria-label="I have seen it and it was fine">
      <span class="em">😐</span>It was fine</button>
  </div>
</section>

</div>
<script>
const base = location.pathname.replace(/\/taste\/?$/, "") + "/taste/api";
// Where the shared trailer code looks things up. Token-scoped here, seat-scoped
// on movie night — same fragment, different authority.
const TRAILER_BASE = base + "/trailer";
</script>
__TRAILER__
<script>
const $ = id => document.getElementById(id);
const picked = {genres: new Set(), countries: new Set()};
// `progress` is tracked but never rendered — nothing on this screen counts up
// at you. It survives because the end-of-session beacon needs to know whether
// there is anything worth rebuilding for.
let queue = [], progress = {rated: 0}, busy = false;

function chip(label, value, bucket) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = label;
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    picked[bucket][on ? "delete" : "add"](value);
    const n = picked.genres.size;
    $("start").disabled = n === 0;
    $("start").textContent = n === 0 ? "Pick at least one"
      : "Start — show me some titles";
  };
  return b;
}

async function boot() {
  const s = await (await fetch(base + "/state")).json();
  s.genres.forEach(g => $("genres").appendChild(chip(g.label, g.slug, "genres")));
  s.countries.forEach(c =>
    $("countries").appendChild(chip(c.label, c.code, "countries")));
  progress = s.progress;
  for (const el of document.querySelectorAll("#genres .chip"))
    if (s.picked_genres.includes(
        s.genres.find(g => g.label === el.textContent).slug)) el.click();
  for (const el of document.querySelectorAll("#countries .chip"))
    if (s.picked_countries.includes(
        s.countries.find(c => c.label === el.textContent).code)) el.click();
}

$("start").onclick = async () => {
  $("start").disabled = true; $("start").textContent = "Finding titles…";
  await fetch(base + "/picks", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({genres: [...picked.genres],
                          countries: [...picked.countries]})});
  await refill();
  $("step-picks").classList.add("hide");
  $("step-deck").classList.remove("hide");
  render();
};

// Every id this session has ever put on screen. The server cannot know them —
// a dealt-but-unanswered card is not a verdict and exists nowhere but here —
// so without sending them back the next deck re-deals titles already queued.
const dealt = new Set();
let refilling = null;

// Consecutive refills that produced nothing new. Somebody who has answered
// hundreds of titles runs out of famous ones in their genres, and at that
// point every refill legitimately returns nothing usable — so an empty deck
// asking for more, on receiving more, is a loop that hammers the server for as
// long as the tab is open. Two empty answers is enough to call it.
let barren = 0;
const BARREN_LIMIT = 2;

function refill() {
  // Concurrent refills were their own duplicate source: running low fires one,
  // the answer handler fires another, and both ask before either has added to
  // `dealt`.
  if (refilling) return refilling;
  refilling = (async () => {
    try {
      const r = await fetch(base + "/deck", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({have: [...dealt]})});
      const d = await r.json();
      let added = 0;
      for (const c of d.cards || []) {
        if (dealt.has(c.id)) continue;
        dealt.add(c.id);
        queue.push(c);
        added++;
      }
      barren = added ? 0 : barren + 1;
      progress = d.progress || progress;
    } catch (e) { /* keep whatever is queued */ }
    refilling = null;
  })();
  return refilling;
}

function render() {
  const deck = $("deck");
  deck.innerHTML = "";
  const card = queue[0];
  if (!card) {
    if (barren >= BARREN_LIMIT) {
      deck.innerHTML = '<p class="hint">That is everything we can find for '
        + 'now — you have been through the lot. Come back tomorrow, or open '
        + 'this link again and pick a few more genres.</p>';
      return;
    }
    deck.innerHTML = '<p class="hint">Looking for more titles…</p>';
    refill().then(render);
    return;
  }
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `<span class="playhint">▶ Trailer</span>
    <img alt="" loading="eager">
    <div class="info"><div class="t"></div>
      <div class="sub"><span class="yr"></span><span class="gn"></span>
      <span class="rt"></span></div></div>`;
  const img = el.querySelector("img");
  if (card.poster) img.src = card.poster; else img.remove();
  attachTrailer(el, card);
  el.querySelector(".t").textContent = card.title || "";
  el.querySelector(".yr").textContent = card.year || "";
  el.querySelector(".gn").textContent = (card.genres || []).join(" · ");
  el.querySelector(".rt").textContent = card.rating ? "★ " + card.rating : "";
  deck.appendChild(el);
  if (queue.length < 6) refill();
}

// Which way the card leaves, matched to the wedge that answered it.
const EXITS = {liked: "out-right", disliked: "out-left",
               watchlist: "out-up", unknown: "out-down", seen: "out-fade"};

async function answer(verdict) {
  if (busy || !queue.length) return;
  busy = true;
  // Answering is a decision about the card underneath; leaving its trailer
  // playing over the next one is not what anybody meant.
  closeSheet();
  const card = queue.shift();
  const el = document.querySelector(".card");
  if (el) el.classList.add(EXITS[verdict] || "out-fade");
  // "It was fine" is not a taste signal, but it is still something they have
  // seen — so it stops the title being recommended back, the same as the two
  // verdicts that do carry a direction. "Want to watch" is not a verdict at
  // all: the server files it in the watchlist instead, which is what stocks
  // the row of the same name.
  try {
    const r = await fetch(base + "/verdict", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: card.id, type: card.type, verdict})});
    progress = (await r.json()).progress || progress;
  } catch (e) { /* a dropped verdict is not worth blocking the session */ }
  setTimeout(() => { busy = false; render(); }, 120);
}

document.querySelectorAll("[data-v]").forEach(b =>
  b.onclick = () => answer(b.dataset.v));

// There is no "done" — people close the tab. A beacon survives the page going
// away where fetch does not, but it can still be dropped, so the server also
// rebuilds on its own every few verdicts. This only makes the last few land
// sooner.
addEventListener("pagehide", () => {
  if (progress.rated && navigator.sendBeacon)
    navigator.sendBeacon(base + "/done");
});
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && progress.rated
      && navigator.sendBeacon)
    navigator.sendBeacon(base + "/done");
});

boot();
</script></body></html>
