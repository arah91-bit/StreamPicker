<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Movie night</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117; --card:#161b22; --line:#262d38; --ink:#e6edf3; --dim:#8b949e;
  --yes:#3fb950; --no:#d4675e; --accent:#e0a33e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none}
.wrap{max-width:520px;margin:0 auto;min-height:100dvh;
  padding:max(16px,env(safe-area-inset-top)) 16px
          max(16px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:3px}
h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
.who{color:var(--dim);font-size:.9rem}
.hint{color:var(--dim);font-size:.9rem;margin:0}
.hide{display:none!important}
.room{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem}
.peer{border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  color:var(--dim)}
.peer.here{border-color:#22562f;color:var(--yes)}
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
/* Contained, not cropped — the title and the faces are what tell somebody
   whether they want to watch it. */
.card img{flex:1;min-height:0;width:100%;object-fit:contain;background:#0b0e13}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px}
.t{font-weight:700;line-height:1.25}
.sub{color:var(--dim);font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{padding:16px 6px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:.95rem;font-weight:700;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px}
.acts .em{font-size:1.4rem;line-height:1}
.acts .no{border-color:#5a2f2b;color:var(--no)}
.acts .yes{border-color:#22562f;color:var(--yes)}
.acts button:disabled{opacity:.45}
.won{text-align:center;display:flex;flex-direction:column;gap:14px;
  align-items:center;padding:18px 8px}
.won .big{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:700}
.won img{width:min(230px,60vw);border-radius:14px;display:block}
.won h2{margin:0;font-size:1.5rem;text-wrap:balance}
.wait{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.85rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .16s ease,opacity .16s ease}
  .card.out-left{transform:translateX(-30px) rotate(-4deg);opacity:0}
  .card.out-right{transform:translateX(30px) rotate(4deg);opacity:0}
  .dot{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head>
<body><div class="wrap">

<header>
  <h1>Movie night</h1>
  <p class="who">you're <b>__WHO__</b> — pick anything you'd be happy to watch</p>
</header>
<div class="room" id="room"></div>

<section id="playing">
  <div class="deck" id="deck"></div>
  <div class="acts">
    <button class="no" id="pass"><span class="em">👎</span>Not tonight</button>
    <button class="yes" id="want"><span class="em">👍</span>I'd watch it</button>
  </div>
  <p class="hint" id="status"></p>
</section>

<section id="done" class="hide">
  <div class="won">
    <div class="big">Winner</div>
    <img id="wposter" alt="">
    <h2 id="wtitle"></h2>
    <p class="hint" id="wsub"></p>
    <p class="hint">Everyone said yes to this one. Enjoy.</p>
  </div>
</section>

</div>
<script>
const base = location.pathname.replace(/\/$/, "");
const $ = id => document.getElementById(id);
let current = null, busy = false, poll = null;

function paintRoom(s) {
  $("room").innerHTML = "";
  for (const o of s.others || []) {
    const el = document.createElement("span");
    el.className = "peer" + (o.here ? " here" : "");
    el.textContent = o.label + " · " + o.voted;
    $("room").appendChild(el);
  }
}

function paintWinner(s) {
  if (poll) { clearInterval(poll); poll = null; }
  $("playing").classList.add("hide");
  $("done").classList.remove("hide");
  const w = s.winner;
  $("wtitle").textContent = w.title || "";
  $("wsub").textContent = [w.year, (w.genres || []).join(" · "),
    w.rating ? "★ " + w.rating : ""].filter(Boolean).join("  ·  ");
  if (w.poster) $("wposter").src = w.poster; else $("wposter").remove();
}

function paint(s) {
  paintRoom(s);
  if (s.winner) return paintWinner(s);
  const card = (s.next || [])[0];
  current = card || null;
  const deck = $("deck");
  deck.innerHTML = "";
  const waiting = !card;
  $("want").disabled = waiting;
  $("pass").disabled = waiting;
  if (waiting) {
    deck.innerHTML = s.exhausted
      ? '<p class="hint">That\'s everything on the list. Waiting to see if '
        + 'the others land on one of yours…</p>'
      : '<p class="hint">Loading…</p>';
    $("status").innerHTML = '<span class="wait"><span class="dot"></span>'
      + 'waiting for the others</span>';
    return;
  }
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `<img alt="" loading="eager">
    <div class="info"><div class="t"></div>
    <div class="sub"><span class="yr"></span><span class="gn"></span>
    <span class="rt"></span></div></div>`;
  const img = el.querySelector("img");
  if (card.poster) img.src = card.poster; else img.remove();
  el.querySelector(".t").textContent = card.title || "";
  el.querySelector(".yr").textContent = card.year || "";
  el.querySelector(".gn").textContent = (card.genres || []).join(" · ");
  el.querySelector(".rt").textContent = card.rating ? "★ " + card.rating : "";
  deck.appendChild(el);
  $("status").textContent = `${s.voted} of ${s.playlist_size} · `
    + `${s.wanted} you'd watch`;
}

async function refresh() {
  try { paint(await (await fetch(base + "/state")).json()); }
  catch (e) { /* a dropped poll is not worth interrupting the evening */ }
}

async function answer(want) {
  if (busy || !current) return;
  busy = true;
  const el = document.querySelector(".card");
  if (el) el.classList.add(want ? "out-right" : "out-left");
  const id = current.id;
  current = null;
  try {
    const r = await fetch(base + "/vote", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id, want})});
    setTimeout(async () => { paint(await r.json()); busy = false; }, 110);
  } catch (e) { busy = false; refresh(); }
}

$("want").onclick = () => answer(true);
$("pass").onclick = () => answer(false);

// Someone else may agree to a film you already said yes to, so the end of the
// evening can arrive while this screen is idle.
poll = setInterval(refresh, 4000);
refresh();
</script></body></html>
